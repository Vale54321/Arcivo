name: Build and publish Arcivo container

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
    paths:
      - "backend/**"
      - "frontend/**"
      - ".forgejo/workflows/arcivo-container.yml"
  workflow_dispatch:

env:
  REGISTRY: git.heiserer.de
  IMAGE_NAME: ${{ forgejo.repository }}/backend

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        env:
          PUBLIC_API_BASE_URL: /api
        run: npm run build

      - name: Stage frontend build into Arcivo image context
        run: |
          rm -rf ./backend/src/client
          mkdir -p ./backend/src/client
          cp -R ./frontend/build/. ./backend/src/client/

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ forgejo.actor }}
          password: ${{ secrets.CONTAINER_REGISTRY_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.source=https://git.heiserer.de/${{ forgejo.repository }}
