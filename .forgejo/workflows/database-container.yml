name: Build and publish database container

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
    paths:
      - "postgres/**"
      - ".forgejo/workflows/database-container.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: git.heiserer.de
  IMAGE_NAME: ${{ forgejo.repository }}/database

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ forgejo.actor }}
          password: ${{ secrets.CONTAINER_REGISTRY_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push database image
        uses: docker/build-push-action@v7
        with:
          context: ./postgres
          file: ./postgres/Dockerfile
          push: true
          build-args: |
            PG_MAJOR=16
            PGVECTOR_TAG=0.8.1
            VECTORCHORD_TAG=0.5.3
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.source=https://git.heiserer.de/${{ forgejo.repository }}
