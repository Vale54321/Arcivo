name: Code quality

on:
  push:

jobs:
  quality:
    name: Affected quality checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Restore Nx task cache
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ forgejo.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Run affected quality checks
        env:
          NX_BASE: ${{ forgejo.event.before }}
          NX_HEAD: ${{ forgejo.sha }}
          PUBLIC_API_BASE_URL: /api
        run: |
          if ! git cat-file -e "$NX_BASE^{commit}" 2>/dev/null; then
            NX_BASE=$(git hash-object -t tree /dev/null)
          fi
          npx nx affected -t lint,check --base="$NX_BASE" --head="$NX_HEAD" --outputStyle=static
