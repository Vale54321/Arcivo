name: Code quality

on:
  push:

jobs:
  backend:
    name: Backend lint and static analysis
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci

      - name: Lint
        working-directory: ./backend
        run: npx eslint "{src,apps,libs,test}/**/*.ts"

      - name: TypeScript analysis
        if: ${{ always() }}
        working-directory: ./backend
        run: npx tsc --noEmit --project tsconfig.json

  frontend:
    name: Frontend lint and static analysis
    runs-on: ubuntu-latest
    env:
      PUBLIC_API_BASE_URL: /api

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Lint
        working-directory: ./frontend
        run: npx eslint .

      - name: Svelte and TypeScript analysis
        if: ${{ always() }}
        working-directory: ./frontend
        run: npm run check
