services:
  redis:
    container_name: arcivo_redis
    image: valkey/valkey:9
    ports:
      - 6379:6379
    healthcheck:
      test: redis-cli ping || exit 1
    restart: unless-stopped

  database:
    container_name: arcivo_postgres
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: arcivo
      POSTGRES_DB: arcivo
      POSTGRES_INITDB_ARGS: --data-checksums
    ports:
      - 5432:5432
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U arcivo -d arcivo']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    container_name: arcivo_backend
    build:
      context: .
      dockerfile: ./apps/backend/Dockerfile
      target: dev
    ports:
      - 3000:3000
    depends_on:
      - database
      - redis
    environment:
      - NODE_ENV=development
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - STORAGE_ROOT=/app/data/library
    volumes:
      - ./apps/backend/src:/app/apps/backend/src
      - ./libs/api-contracts/src:/app/libs/api-contracts/src
      - ./libs/ui-components/src:/app/libs/ui-components/src
      - ./data/library:/app/data/library
      - ./data/temp:/app/apps/backend/temp
    restart: unless-stopped

  gotenberg:
    image: gotenberg/gotenberg:8
    ports:
      - 3001:3000
    environment:
      - API_TIMEOUT=300s
